{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login card">
  <h1>Sign in</h1>
  <p class="muted">Authorised clinical staff only.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="64" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
